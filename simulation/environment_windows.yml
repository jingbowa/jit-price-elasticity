name: Price_elasticity
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0
  - pytorch-cuda=11.8
  - numpy>=1.26,<2
  - pandas>=2.0
  - scipy>=1.13
  - numba>=0.60
  - matplotlib>=3.8
  - seaborn>=0.13
  - tqdm
  - joblib
  - scikit-learn
  - pip:
    - pyblp
    - NumbaMinpack  # complementarity/variety DGPs; requires a C/Fortran toolchain on Windows
